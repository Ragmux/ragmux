# Front end for a scaled split deployment (docker-compose.scale.yml).
# Docker's embedded DNS resolves the service name "ragmux" to every replica
# and rotates the answers, so this load balances across them without any
# ip_hash or sticky cookie: nothing in Ragmux keeps per-client state in the
# process, SSE streams included (docs/scaling.md#streaming).

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. An upstream block would resolve the name once
    # at startup and pin one replica; a variable in proxy_pass re-resolves
    # it, which is what picks up a `--scale` change without a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # At least MAX_UPLOAD_MB, for document uploads.
    client_max_body_size 64m;
    # The gateway gives a client 10 s for a login body, 30 s for other admin
    # JSON, 5 min for uploads and 60 s for a chat request; dropping a
    # stalled client here first keeps both sides from holding the slot.
    client_body_timeout 60s;

    location / {
        set $ragmux_upstream ragmux:8765;
        proxy_pass http://$ragmux_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: never buffer a streaming completion, and outlive the longest
        # one. Keep proxy_read_timeout >= STREAM_MAX_DURATION (default 30m).
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
