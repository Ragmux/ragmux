<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ragmux Gateway</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Self-hosted fonts (SIL OFL, see fonts/OFL-*.txt). Latin + latin-ext subsets. */
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:600 700;font-display:swap;src:url(fonts/bricolage-grotesque-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:600 700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/ibm-plex-sans-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400 500;font-display:swap;src:url(fonts/jetbrains-mono-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400 500;font-display:swap;src:url(fonts/jetbrains-mono-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{--bg:#0e1117;--bg2:#12161e;--panel:#161b25;--panel2:#1c2230;--line:#252d3c;--line2:#324056;--tx:#eceef4;--tx2:#aab3c5;--tx3:#8a95ab;--amber:#f2b632;--amber-ink:#2a1d02;--mint:#3fd0a4;--rose:#f47186;--blue:#6fb0ff;--violet:#a68cff;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--disp:"Bricolage Grotesque","Avenir Next",Futura,system-ui,sans-serif;--body:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 1px 1px,#1b2130 1px,transparent 0);background-size:24px 24px}
a{color:var(--amber);text-decoration:none}a:hover{color:#ffd36b}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1}h2{font-size:20px}
h3{font-family:var(--body);font-size:11.5px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:12.5px}
code{color:var(--tx2)}
pre{font-family:var(--mono);font-size:12px;background:#0f131b;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hidden{display:none!important}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.muted{color:var(--tx3)}.dim{color:var(--tx2)}.hint{font-size:12px;color:var(--tx3)}
.row{display:flex;gap:12px;align-items:center}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.right{text-align:right}.nowrap{white-space:nowrap}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:none;display:flex;flex-direction:column;background:#0a0d13;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;z-index:3}
.side::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 260px at 20% -10%,rgba(242,182,50,.16),transparent 70%);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;padding:24px 20px 18px;position:relative}
.mark{width:38px;height:38px;flex:none;border-radius:11px;background:#0b0c0e;color:var(--amber);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(242,182,50,.22)}
.brand-name{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1}
.brand-sub{font-size:11px;color:var(--tx3);margin-top:4px;font-family:var(--mono)}
.nav{display:flex;flex-direction:column;gap:4px;padding:8px 12px;position:relative}
.nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--tx2);font-weight:500;min-height:44px;border:0;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:#131823;color:var(--tx)}
.nav-item.active{background:#1a2130;color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.nav-item.active svg{color:var(--amber)}
.nav-item svg{width:18px;height:18px;flex:none}
.nav-badge{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--tx3);background:#111621;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.nav-badge:empty{display:none}
.side-foot{margin-top:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);position:relative}
.health{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);font-family:var(--mono);min-height:18px}
.dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(63,208,164,.18)}
.dot.err{background:var(--rose);box-shadow:0 0 0 4px rgba(244,113,134,.18)}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;flex:none;border-radius:9px;background:linear-gradient(135deg,#f2b632,#ff7a59);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;color:#1b1204;font-size:13px;text-transform:uppercase}
.avatar.sm{width:30px;height:30px;font-size:12px}.avatar.xs{width:24px;height:24px;font-size:10px;border-radius:7px}
.me-name{font-weight:600;font-size:13px}.me-role{font-size:11.5px;color:var(--tx3)}
.side-actions{display:flex;gap:8px}
.side-actions .btn{flex:1;justify-content:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px;padding:26px 32px 32px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:11.5px;color:var(--tx3);letter-spacing:.04em;margin-bottom:6px;text-transform:uppercase}
.lede{color:var(--tx2);margin:6px 0 0;max-width:640px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* buttons, pills, inputs */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#44536f;color:var(--tx)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:transparent;font-weight:600;box-shadow:0 6px 18px rgba(242,182,50,.22)}
.btn.primary:hover{background:#ffc74a;color:var(--amber-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--rose)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.icon-btn{width:36px;height:36px;flex:none;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);cursor:pointer}
.icon-btn:hover{color:var(--tx);border-color:#44536f}
.icon-btn svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-family:var(--mono);border:1px solid var(--line2);color:var(--tx2);background:#121722;white-space:nowrap;vertical-align:middle}
.pill.ok{color:#8fe9c9;border-color:rgba(63,208,164,.35);background:rgba(63,208,164,.08)}
.pill.err{color:#ffa3b0;border-color:rgba(244,113,134,.4);background:rgba(244,113,134,.1)}
.pill.warn{color:#ffd36b;border-color:rgba(242,182,50,.4);background:rgba(242,182,50,.1)}
.pill.info{color:#a9ceff;border-color:rgba(111,176,255,.4);background:rgba(111,176,255,.1)}
.pill.violet{color:#cbbdff;border-color:rgba(166,140,255,.4);background:rgba(166,140,255,.1)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field legend{font-size:12.5px;color:var(--tx2);font-weight:500;padding:0}
.input{min-height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:#0f131b;color:var(--tx);width:100%}
.input:focus{outline:2px solid rgba(242,182,50,.45);outline-offset:0;border-color:var(--amber)}
.input::placeholder{color:#6b7689}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select.input option{background:#12161f}
textarea.input{min-height:96px;padding:10px 12px;resize:vertical}
.search{position:relative}
.search .input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--tx3);pointer-events:none}
.tabs{display:inline-flex;gap:4px;background:#0f131b;border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{padding:7px 12px;border-radius:7px;font-size:13px;color:var(--tx2);border:0;background:transparent;cursor:pointer;min-height:34px}
.tab:hover{color:var(--tx)}
.tab.on,.tab[aria-pressed="true"],.tab[aria-selected="true"]{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.chip{padding:5px 11px;border-radius:999px;font-size:12px;font-family:var(--mono);color:var(--tx2);border:1px solid var(--line2);background:transparent;cursor:pointer}
.chip:hover{color:var(--tx)}.chip.on{background:var(--panel2);color:var(--tx);border-color:#44536f}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--tx2);background:#0f131b}
.toggle{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;justify-content:space-between}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.switch{width:40px;height:22px;flex:none;border-radius:999px;background:#2a3242;position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#8a95ab;transition:left .15s,background .15s}
.toggle input:checked+.switch{background:var(--amber)}
.toggle input:checked+.switch::after{left:21px;background:#1b1204}
.toggle input:focus-visible+.switch{outline:2px solid var(--amber);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--tx2)}
.check:hover{background:#131823;color:var(--tx)}
.check input{accent-color:var(--amber);width:16px;height:16px;margin:0}
.checklist{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line2);border-radius:10px;background:#0f131b;padding:6px;max-height:190px;overflow:auto}
.radio-card{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;cursor:pointer}
.radio-card input{accent-color:var(--amber);margin:0;width:16px;height:16px}
.radio-card:has(input:checked){border-color:var(--amber);background:rgba(242,182,50,.06)}
.radio-card:has(input:focus-visible){outline:2px solid var(--amber);outline-offset:2px}
.strength{display:flex;gap:4px;margin-top:2px}
.strength i{flex:1;height:4px;border-radius:2px;background:#2a3242}
.strength[data-score="1"] i:nth-child(-n+1){background:var(--rose)}
.strength[data-score="2"] i:nth-child(-n+2){background:var(--amber)}
.strength[data-score="3"] i:nth-child(-n+3){background:var(--mint)}
.strength[data-score="4"] i{background:var(--mint)}

/* cards, stats, tables */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:0 1px 0 rgba(255,255,255,.02) inset,0 12px 32px rgba(0,0,0,.28)}
.card.flat{box-shadow:none}
.card.sel{border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,182,50,.12)}
.card.tight{padding:16px 18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head.m0{margin:0}
.note{padding:12px 16px;border-radius:12px;display:flex;align-items:center;gap:12px;border:1px solid var(--line2);background:var(--panel2)}
.note.warn{background:rgba(242,182,50,.06);border-color:rgba(242,182,50,.35)}
.note.err{background:rgba(244,113,134,.06);border-color:rgba(244,113,134,.35)}
.note.ok{background:rgba(63,208,164,.06);border-color:rgba(63,208,164,.35)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;min-width:0}
.stat .l{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:8px}
.stat .v{font-family:var(--disp);font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.stat .v small{font-size:14px;color:var(--tx3);margin-left:4px;font-family:var(--body);font-weight:500}
.stat .d{font-size:12px;color:var(--tx3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .d.up{color:var(--mint)}.stat .d.down{color:var(--rose)}
.stat .spark{position:absolute;right:12px;bottom:10px;opacity:.9}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #1d2431;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#191f2b}
td.json{font-family:var(--mono);font-size:11.5px;color:var(--tx2);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{height:6px;border-radius:999px;background:#0f131b;overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;border-radius:999px;background:var(--amber)}
.meter.mint>i{background:var(--mint)}.meter.rose>i{background:var(--rose)}.meter.blue>i{background:var(--blue)}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:26px;text-align:center;color:var(--tx3)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative}
.chart svg{display:block;width:100%;height:230px}
.chart-x{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--tx3);padding:6px 2px 0}
.chart-tip{position:absolute;top:8px;pointer-events:none;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--tx);white-space:nowrap;transform:translateX(-50%)}
.chart-tip .hint{font-size:10px}
.provider{width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:13px;background:rgba(138,149,171,.14);color:var(--tx2);border:1px solid var(--line2)}
.provider.sm{width:30px;height:30px;font-size:12px}
.p-openai{background:rgba(63,208,164,.14);color:#8fe9c9;border-color:rgba(63,208,164,.35)}
.p-anthropic{background:rgba(242,182,50,.14);color:#ffd36b;border-color:rgba(242,182,50,.35)}
.p-gemini{background:rgba(111,176,255,.14);color:#a9ceff;border-color:rgba(111,176,255,.35)}
.p-ollama{background:rgba(166,140,255,.14);color:#cbbdff;border-color:rgba(166,140,255,.35)}
.p-deepseek{background:rgba(244,113,134,.14);color:#ffa3b0;border-color:rgba(244,113,134,.35)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:center}
.kv .k{color:var(--tx3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px 20px;align-items:start}
.split.wide{grid-template-columns:400px minmax(0,1fr)}
.split.pg{grid-template-columns:minmax(0,1fr) 340px}
.ov-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
.bar-row{display:flex;flex-direction:column;gap:6px}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ring-tile{display:flex;align-items:center;gap:12px;min-width:0}
.ring-tile svg{width:76px;height:76px;flex:none}
.ring-tile .big{font-family:var(--disp);font-size:19px;font-weight:600;line-height:1.1;margin:2px 0;overflow-wrap:anywhere}
.hit{display:grid;grid-template-columns:34px 1fr 150px;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.hit .n{font-family:var(--mono);color:var(--amber);font-size:13px}
.hit .score{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:11px;color:var(--tx3)}
.hit pre{background:transparent;border:0;padding:0;font-family:var(--body);font-size:13px;color:var(--tx2);max-height:140px}
.drop{border:1px dashed rgba(242,182,50,.45);background:rgba(242,182,50,.04);border-radius:14px;padding:18px;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--tx2);cursor:pointer;width:100%;font:inherit}
.drop.over{background:rgba(242,182,50,.12);border-style:solid}
.drop svg{width:20px;height:20px;color:var(--amber)}
.store-card{cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.store-card:hover{border-color:var(--line2)}

/* chat */
.chat-card{display:flex;flex-direction:column;padding:0;min-height:560px}
.chat{flex:1;display:flex;flex-direction:column;gap:18px;padding:24px;overflow:auto;max-height:70vh}
.bubble.user{align-self:flex-end;max-width:66%;background:var(--amber);color:var(--amber-ink);padding:12px 16px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;word-break:break-word}
.bubble.asst{display:flex;gap:12px;align-items:flex-start}
.bubble.asst .body{max-width:72%;background:var(--panel2);border:1px solid var(--line2);padding:12px 16px;border-radius:4px 16px 16px 16px;line-height:1.55;white-space:pre-wrap;word-break:break-word;min-width:60px}
.bubble.asst .body.err{border-color:rgba(244,113,134,.4);color:#ffa3b0}
.caret{display:inline-block;width:8px;height:15px;background:var(--amber);vertical-align:-2px;margin-left:3px;border-radius:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.meta{display:flex;gap:8px;margin-left:42px;flex-wrap:wrap}
.composer{border-top:1px solid var(--line);padding:14px 16px;display:flex;gap:10px;align-items:flex-end;background:#12161f;border-radius:0 0 16px 16px}
.composer textarea{min-height:56px;flex:1}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-family:var(--mono);font-size:12px}

/* drawer & modal & toast */
.drawer-bg,.modal-bg{position:fixed;inset:0;background:rgba(5,7,11,.55);z-index:20;opacity:0;transition:opacity .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:#12161f;border-left:1px solid var(--line2);display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.45);z-index:21;transform:translateX(100%);transition:transform .18s ease-out;margin:0}
.open .drawer{transform:none}.open .drawer-bg,.open .modal-bg{opacity:1}
.drawer-head{padding:22px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.drawer-body{padding:20px 24px;display:flex;flex-direction:column;gap:16px;overflow:auto;flex:1}
.drawer-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.modal{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:560px;max-width:calc(100vw - 32px);background:#12161f;border:1px solid var(--line2);border-radius:16px;padding:24px;z-index:21;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.5);margin:0;max-height:80vh;overflow:auto}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--line2);color:var(--tx);padding:12px 16px;border-radius:12px;z-index:30;max-width:440px;white-space:pre-wrap;box-shadow:0 12px 32px rgba(0,0,0,.4);font-size:13px}
.toast.err{border-color:rgba(244,113,134,.5)}
.toast.ok{border-color:rgba(63,208,164,.5)}

/* auth screens */
.auth{display:flex;min-height:100vh}
.auth-hero{width:640px;flex:none;position:relative;overflow:hidden;background:#0a0d13;display:flex;flex-direction:column;justify-content:space-between;padding:44px 48px;border-right:1px solid var(--line)}
.auth-hero .glow{position:absolute;inset:0;background:radial-gradient(520px 420px at 30% 20%,rgba(242,182,50,.22),transparent 70%),radial-gradient(420px 380px at 90% 90%,rgba(63,208,164,.14),transparent 70%)}
.auth-hero .deco{position:absolute;inset:0;width:100%;height:100%}
.auth-hero>*{position:relative}
.auth-hero h1{font-size:44px;line-height:1.05}
.auth-form{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-form form{width:420px;max-width:100%;padding:32px;display:flex;flex-direction:column;gap:18px}
.auth-form h2{font-size:26px}
.status-lines{display:flex;flex-direction:column;gap:8px;font-size:13px}

/* responsive */
@media (max-width:1100px){
  .side{width:64px}
  .side .brand{padding:20px 13px 14px;justify-content:center}
  .side .brand>div:last-child,.side .nav-label,.side .nav-text,.side .nav-badge,.side .health span:not(.dot),.side .me>div,.side .side-actions .lbl{display:none}
  .side .nav{padding:8px}
  .side .nav-item{justify-content:center;padding:10px}
  .side .side-foot{padding:12px 10px 14px;align-items:center}
  .side .side-actions{flex-direction:column}
  .main{padding:22px 20px 28px}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .split,.split.wide,.split.pg,.ov-grid,.grid2{grid-template-columns:minmax(0,1fr)}
  .auth-hero{display:none}
}
@media (max-width:760px){
  .stats,.stats.four,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drawer{width:100vw}
}
</style>
</head>

<script>
'use strict';
// ---------------------------------------------------------------------------
// helpers
// ---------------------------------------------------------------------------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = n => Number(n || 0).toLocaleString('en-US');
const fmtK = n => { n = Number(n || 0); return n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n % 1e3 && n < 1e5 ? 1 : 0) + 'k' : String(n); };
const fmtBytes = b => { b = Number(b || 0); return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1024).toFixed(b < 10240 ? 1 : 0) + ' KB'; };
const mb = b => (Number(b || 0) / 1048576).toFixed(b && b < 1048576 ? 2 : 1);
const fmtDate = s => s ? new Date(s).toLocaleString() : '';
const fmtTime = s => s ? new Date(s).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
const fmtDay = s => s ? new Date(s).toLocaleString([], { month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const fmtMonthDay = s => new Date(s).toLocaleDateString([], { month: 'short', day: '2-digit' });
const fmtMs = ms => `${fmtN(Math.round(ms || 0))} ms`;
// "34 s", "6h 12m", "3d 4h" for a duration in milliseconds.
function fmtDur(ms) {
  if (ms <= 0) return 'now';
  const s = Math.round(ms / 1000);
  if (s < 90) return `${s} s`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  if (h < 48) return `${h}h ${m % 60}m`;
  return `${Math.floor(h / 24)}d ${h % 24}h`;
}
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const initials = name => String(name || '?').replace(/[^a-z0-9]/gi, '').slice(0, 2).toUpperCase() || '?';
const GRADIENTS = ['#f2b632,#ff7a59', '#6fb0ff,#a68cff', '#3fd0a4,#6fb0ff', '#a68cff,#f47186', '#8a95ab,#324056', '#3fd0a4,#f2b632'];
const avatar = (name, cls = '') => { let h = 0; for (const c of String(name || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `<div class="avatar ${cls}" style="background:linear-gradient(135deg,${GRADIENTS[h % GRADIENTS.length]})" aria-hidden="true">${esc(initials(name))}</div>`; };
const meter = (p, cls = '') => `<div class="meter ${cls || (p >= 90 ? 'rose' : p >= 70 ? '' : 'mint')}"><i style="width:${Math.min(100, Math.max(0, p))}%"></i></div>`;
const pctPill = p => `<span class="pill ${p >= 90 ? 'err' : p >= 70 ? 'warn' : 'ok'}">${p}%</span>`;
const statusPill = c => `<span class="pill ${c < 400 ? 'ok' : c === 429 ? 'warn' : c === 499 ? '' : 'err'}">${c}</span>`;
const flagPills = r => [r.streamed ? '<span class="pill info">stream</span>' : '', r.rag_used ? `<span class="pill violet">rag ${fmtN(r.rag_hits || 0)}</span>` : ''].filter(Boolean).join(' ');
const ICON = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12 20 4l-4 16-4-7z"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12m0 0 4-4m-4 4-4-4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
};

const state = { user: null, needsSetup: false, tab: 'overview', models: [], rag: [], projects: [], providerTypes: [], users: [], system: null, sessionExp: null,
  overview: { window: '24h' }, openStore: null, openProject: null, users_filter: { q: '', role: 'all' },
  playground: { key: '', system: '', stream: true, sources: true, msgs: [], last: null } };
const ROLE_RANK = { viewer: 1, editor: 2, admin: 3 };
// can('editor') is true for editors and admins; the API enforces the same matrix.
const can = role => !!state.user && (ROLE_RANK[state.user.role] || 0) >= (ROLE_RANK[role] || 99);
const modelById = id => state.models.find(m => m.id === id);
const modelName = id => (modelById(id) || {}).name || '#' + id;
const ragName = id => id ? ((state.rag.find(r => r.id === id) || {}).name || '#' + id) : '—';
const userName = id => (state.users.find(u => u.id === id) || {}).username || '#' + id;
const projectName = id => (state.projects.find(p => p.id === id) || {}).name || '#' + id;
const ptype = t => state.providerTypes.find(x => x.type === t) || {};
const PROVIDER_LETTER = { openai: 'O', anthropic: 'A', gemini: 'G', ollama: 'L', deepseek: 'D', custom_openai: 'C' };
const providerBadge = (type, cls = '') => `<div class="provider p-${esc(type)} ${cls}" aria-hidden="true">${PROVIDER_LETTER[type] || (type || '?')[0].toUpperCase()}</div>`;
// Compact "2 rpm · 10k tpm · 1M/day" summary of a project's non-zero limits.
const limitSummary = p => [p.rate_limit_rpm ? `${fmtK(p.rate_limit_rpm)} rpm` : '', p.rate_limit_tpm ? `${fmtK(p.rate_limit_tpm)} tpm` : '', p.budget_daily_tokens ? `${fmtK(p.budget_daily_tokens)}/day` : '', p.budget_monthly_tokens ? `${fmtK(p.budget_monthly_tokens)}/month` : ''].filter(Boolean).join(' · ') || 'unlimited';
// "hybrid (english) · rerank 15 · dist ≤ 0.6" summary of a store's retrieval settings.
const retrievalSummary = r => [r.search_mode === 'vector' ? 'vector' : `hybrid (${r.fts_config || 'simple'})`, r.rerank ? `rerank ${r.rerank_candidates}` : '', r.max_distance ? `dist ≤ ${r.max_distance}` : ''].filter(Boolean).join(' · ');

let toastTimer;
function toast(msg, ms = 3500, cls = '') {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast ' + cls; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), ms);
}
const errMsg = (data, fallback) => (data && data.error && data.error.message) || fallback || 'request failed';

// request returns the raw outcome so the sign-in screen can read the status
// and headers; api() is the throwing wrapper every other screen uses.
async function request(path, opts = {}) {
  const o = { headers: {}, ...opts };
  if (o.body && !(o.body instanceof FormData)) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(o.body); }
  const r = await fetch('/admin/api' + path, o);
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('json') ? await r.json() : await r.text();
  return { status: r.status, ok: r.ok, data, headers: r.headers };
}
async function api(path, opts) {
  const r = await request(path, opts);
  if (r.status === 401 && !path.startsWith('/login') && !path.startsWith('/setup')) { signedOut(); throw new Error('session expired'); }
  if (r.status === 403) { const m = errMsg(r.data, 'forbidden'); toast('Not allowed: ' + m, 4000, 'err'); throw new Error(m); }
  if (!r.ok) throw new Error(errMsg(r.data, r.statusText));
  return r.data;
}
const on = (root, sel, ev, fn) => $$(sel, root).forEach(el => el.addEventListener(ev, e => fn(el, e)));

// ---------------------------------------------------------------------------
// form building blocks
// ---------------------------------------------------------------------------
let fieldSeq = 0;
const fid = name => `f-${name}-${++fieldSeq}`;
function field(name, label, inner, hint = '') {
  const id = fid(name);
  return `<div class="field"><label for="${id}">${esc(label)}</label>${inner.replace('<INPUT', `<input id="${id}"`).replace('<SELECT', `<select id="${id}"`).replace('<TEXTAREA', `<textarea id="${id}"`)}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}
const input = (name, val = '', attrs = '') => `<INPUT class="input" name="${name}" value="${esc(val)}" ${attrs}>`;
const textarea = (name, val = '', attrs = '') => `<TEXTAREA class="input" name="${name}" ${attrs}>${esc(val)}</TEXTAREA>`;
const select = (name, opts, val, attrs = '') => `<SELECT class="input" name="${name}" ${attrs}>${opts.map(o => `<option value="${esc(o.value)}" ${String(o.value) === String(val) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</SELECT>`;
const toggle = (name, checked, label, hint = '') => `<label class="toggle"><span><span class="dim">${esc(label)}</span>${hint ? `<div class="hint">${hint}</div>` : ''}</span><input type="checkbox" name="${name}" ${checked ? 'checked' : ''}><span class="switch" aria-hidden="true"></span></label>`;
const checklist = (name, opts, vals = [], empty = 'Nothing to choose from.') => `<div class="checklist">${opts.map(o => `<label class="check"><input type="checkbox" name="${name}" value="${esc(o.value)}" ${vals.map(String).includes(String(o.value)) ? 'checked' : ''}>${esc(o.label)}</label>`).join('') || `<div class="hint" style="padding:6px 10px">${esc(empty)}</div>`}</div>`;
const twoCol = (a, b) => `<div class="row" style="align-items:flex-start"><div class="grow">${a}</div><div class="grow">${b}</div></div>`;
const ROLES = [{ value: 'admin', label: 'admin', hint: 'Everything, including users and the audit log' }, { value: 'editor', label: 'editor', hint: 'Models, RAG stores and own projects' }, { value: 'viewer', label: 'viewer', hint: 'Read-only across member projects' }];
const roleCards = val => `<fieldset class="field" style="border:0;padding:0;margin:0;gap:8px"><legend>Role</legend>${ROLES.map(r => `<label class="radio-card"><input type="radio" name="role" value="${r.value}" ${r.value === val ? 'checked' : ''}><div><div style="font-weight:500">${r.label}</div><div class="hint">${r.hint}</div></div></label>`).join('')}</fieldset>`;
// Client-side strength heuristic: length and character variety; the server only enforces length.
function strengthScore(pw) {
  if (!pw) return 0;
  let s = 0;
  if (pw.length >= 8) s++;
  if (pw.length >= 12) s++;
  const kinds = [/[a-z]/, /[A-Z]/, /\d/, /[^\w]/].filter(re => re.test(pw)).length;
  if (kinds >= 3) s++;
  if (pw.length >= 16 && kinds >= 2) s++;
  return Math.min(4, s);
}
const STRENGTH = ['', 'Weak', 'Fair', 'Strong', 'Very strong'];
const strengthMeter = id => `<div class="strength" data-score="0" id="${id}"><i></i><i></i><i></i><i></i></div><div class="hint" id="${id}-t">Minimum length applies; longer and mixed is better.</div>`;
function bindStrength(inputEl, id, min) {
  const upd = () => { const v = inputEl.value; const s = strengthScore(v); $('#' + id).dataset.score = s; $(`#${id}-t`).textContent = v ? `${STRENGTH[s] || 'Weak'} · ${v.length} characters${v.length < min ? ` (minimum ${min})` : ''}` : `Minimum ${min} characters; longer and mixed is better.`; };
  inputEl.addEventListener('input', upd); upd();
}
const formData = form => { const d = Object.fromEntries(new FormData(form).entries()); for (const cb of $$('input[type=checkbox]', form)) d[cb.name] = cb.checked; return d; };
const checkedValues = (form, name) => $$(`input[name="${name}"]:checked`, form).map(i => Number(i.value));

// ---------------------------------------------------------------------------
// drawer (forms) and modal (confirm / key reveal)
// ---------------------------------------------------------------------------
let lastFocus = null;
function drawer({ eyebrow = '', title, body, submitLabel = 'Save', onSubmit, extra = '', hideSubmit = false }) {
  closeDrawer();
  lastFocus = document.activeElement;

// ---------------------------------------------------------------------------
// shared drawing: sparkline, area chart, usage ring

function sparkline(values, color) {
  if (values.length < 2) return '';
  const max = Math.max(1, ...values); const w = 72, h = 26;
  const pts = values.map((v, i) => `${(i * w / (values.length - 1)).toFixed(1)} ${(h - 3 - (h - 6) * v / max).toFixed(1)}`);
  return `<svg class="spark" width="72" height="26" viewBox="0 0 72 26" fill="none" aria-hidden="true"><path d="M${pts.join(' L')}" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
// Requests-per-day area chart with an errors line; hover shows the day's numbers.
function areaChart(series) {
  let daily = series;
  const W = 860, H = 230, top = 12, bottom = 200;
  if (!daily.length) return '<div class="empty">No requests in this range yet.</div>';
  if (daily.length === 1) daily = [daily[0], daily[0]];
  const max = Math.max(1, ...daily.map(d => d.requests));
  const x = i => daily.length > 1 ? i * W / (daily.length - 1) : W / 2;
  const y = v => bottom - (bottom - top) * v / max;
  const line = key => daily.map((d, i) => `${x(i).toFixed(1)} ${y(d[key]).toFixed(1)}`).join(' L');
  const grid = [0.25, 0.5, 0.75, 1].map(f => `<line x1="0" y1="${(bottom - (bottom - top) * f).toFixed(1)}" x2="${W}" y2="${(bottom - (bottom - top) * f).toFixed(1)}"/>`).join('');
  const labels = series.filter((_, i) => series.length <= 8 || i % Math.ceil(series.length / 8) === 0 || i === series.length - 1).map(d => `<span>${esc(fmtMonthDay(d.day))}</span>`).join('');
  return `<div class="chart" id="areaChart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Requests per day">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b632" stop-opacity=".35"/><stop offset="1" stop-color="#f2b632" stop-opacity="0"/></linearGradient></defs>
    <g stroke="#232b39" stroke-width="1">${grid}</g>
    <path d="M${line('requests')} V${bottom} H0Z" fill="url(#ga)"/>
    <path d="M${line('requests')}" fill="none" stroke="#f2b632" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <path d="M${line('errors')}" fill="none" stroke="#f47186" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <g id="chartDots" fill="#f2b632">${daily.map((d, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(d.requests).toFixed(1)}" r="0" data-i="${i}"/>`).join('')}</g></svg>
    <div class="chart-tip hidden" id="chartTip"></div><div class="chart-x">${labels}</div></div>`;
}
function bindChart(daily) {
  const el = $('#areaChart'); if (!el || !daily.length) return; const svg = $('svg', el), tip = $('#chartTip');
  svg.addEventListener('mousemove', e => { const r = svg.getBoundingClientRect(); const i = Math.max(0, Math.min(daily.length - 1, Math.round((e.clientX - r.left) / r.width * (daily.length - 1)))); const d = daily[i];
    tip.innerHTML = `${esc(fmtMonthDay(d.day))} · ${fmtN(d.requests)} req<div class="hint">${fmtN(d.errors)} err · ${fmtK(d.prompt_tokens + d.completion_tokens)} tokens</div>`; tip.classList.remove('hidden');
    tip.style.left = `${Math.max(60, Math.min(r.width - 60, (daily.length > 1 ? i / (daily.length - 1) : .5) * r.width))}px`;
    $$('circle', svg).forEach(c => c.setAttribute('r', c.dataset.i == i ? '4' : '0')); });
  svg.addEventListener('mouseleave', () => { tip.classList.add('hidden'); $$('circle', svg).forEach(c => c.setAttribute('r', '0')); });
}
const RING_C = 2 * Math.PI * 42;
function ring(p, color, label) {

  const ta = $('#pg-text'); ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#pgForm').requestSubmit(); } };
  const chat = $('#chat'); chat.scrollTop = chat.scrollHeight;
  $('#pgForm').onsubmit = e => { e.preventDefault(); const text = ta.value.trim(); if (!text || !pg.key) { toast('Enter a project key and a message', 3000, 'err'); return; } ta.value = ''; sendMessage(text); };
}
const keyHint = (proj, model) => proj ? `Resolved to <strong>${esc(proj.name)}</strong>${model ? ' · ' + esc(model.model_name) : ''}${proj.rag_store_id ? ' · ' + esc(ragName(proj.rag_store_id)) : ''}` : 'Not matched to a project you can see (keys are matched by prefix).';
const msgMeta = msg => msg.role === 'assistant' && !msg.pending && (msg.stats || (msg.sources || []).length) ? `<div class="meta">${msg.stats ? msg.stats.map(s => `<span class="pill ${s.cls || ''}">${esc(s.text)}</span>`).join('') : ''}${(msg.sources || []).map((s, i) => `<span class="pill info" title="${esc([s.section, s.page ? 'p.' + s.page : '', s.score != null ? 'score ' + Number(s.score).toFixed(4) : ''].filter(Boolean).join(' · '))}">[${i + 1}] ${esc(s.filename)}</span>`).join('')}</div>` : '';
async function sendMessage(text) {
  const pg = state.playground;
  pg.msgs.push({ role: 'user', content: text }); const asst = { role: 'assistant', content: '', pending: true }; pg.msgs.push(asst); renderPlayground();
  const body = $('.bubble.asst:last-of-type .body', $('#chat')); const chat = $('#chat'); $('#pgSend').disabled = true;
  const t0 = performance.now(); let firstToken = null, usage = null, ragHits = null, sources = [], status = 0; const headers = [];
  const history = pg.msgs.filter(m => m.content && !m.error).map(m => ({ role: m.role, content: m.content }));
  const messages = pg.system.trim() ? [{ role: 'system', content: pg.system.trim() }, ...history] : history;
  const payload = { model: 'default', stream: pg.stream, messages }; if (pg.sources && !pg.stream) payload.ragmux = { include_context: true };
  try {
    const r = await fetch('/v1/chat/completions', { method: 'POST', headers: { 'Authorization': 'Bearer ' + pg.key, 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    status = r.status;
    for (const h of ['x-ragmux-rag-hits', 'x-ratelimit-remaining-requests', 'x-ratelimit-limit-requests', 'x-ragmux-budget-daily-remaining', 'x-ragmux-budget-monthly-remaining']) { const v = r.headers.get(h); if (v != null) headers.push([h, v]); }
    if (r.headers.get('x-ragmux-rag-hits') != null) ragHits = Number(r.headers.get('x-ragmux-rag-hits'));
    const src = r.headers.get('x-ragmux-rag-sources'); if (src) { try { sources = JSON.parse(src); } catch (e) { /* trimmed header, ignore */ } }
    if (!r.ok) { const err = await r.json().catch(() => ({})); const ra = r.headers.get('Retry-After');
      throw new Error((r.status === 429 ? '429 ' + ((err.error || {}).type || 'rate limited') + ': ' : `${r.status} `) + ((err.error || {}).message || r.statusText) + (ra ? ` (Retry-After: ${ra}s)` : '')); }
    if (pg.stream) {
      const rd = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
      while (true) { const { done, value } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true }); let i;
        while ((i = buf.indexOf('\n\n')) >= 0) { const ev = buf.slice(0, i); buf = buf.slice(i + 2);
          for (const line of ev.split('\n')) { if (!line.startsWith('data:')) continue; const d = line.slice(5).trim(); if (d === '[DONE]') continue;
            try { const j = JSON.parse(d); if (j.error) throw new Error(j.error.message); if (j.usage) usage = j.usage; const c = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
              if (c) { if (firstToken == null) firstToken = performance.now() - t0; asst.content += c; body.textContent = asst.content; body.insertAdjacentHTML('beforeend', '<span class="caret" aria-hidden="true"></span>'); chat.scrollTop = chat.scrollHeight; } }
            catch (pe) { if (pe.message) asst.content += `\n[error: ${pe.message}]`; } } } }
    } else {
      const j = await r.json(); firstToken = performance.now() - t0; asst.content = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || ''; usage = j.usage || null;
      if (j.ragmux && Array.isArray(j.ragmux.sources)) sources = j.ragmux.sources;
    }
  } catch (err) { asst.error = true; asst.content = asst.content || `[error: ${err.message}]`; }
  finally {
    const latency = performance.now() - t0; asst.pending = false;
    asst.stats = [ragHits != null ? { text: `rag ${ragHits} hit${ragHits === 1 ? '' : 's'}`, cls: 'violet' } : null, usage ? { text: `${fmtN(usage.prompt_tokens)} → ${fmtN(usage.completion_tokens)} tokens` } : null, { text: `${(latency / 1000).toFixed(1)} s · ${pg.stream ? 'stream' : 'json'}` }].filter(Boolean);
    asst.sources = sources;
    const rem = headers.find(h => h[0] === 'x-ratelimit-remaining-requests'), lim = headers.find(h => h[0] === 'x-ratelimit-limit-requests');
    pg.last = { status, latency, firstToken, usage, ragHits, remaining: rem ? rem[1] : null, limit: lim ? lim[1] : null, headers };
    renderPlayground(); $('#pg-text').focus();
  }
}

// ---------------------------------------------------------------------------
// users (admin)
// ---------------------------------------------------------------------------
async function renderUsers() {
  const app = $('#app'); app.innerHTML = '<div class="card">Loading…</div>';
  let users, sec = null;
  try { [users, sec] = await Promise.all([api('/users'), api('/security/logins').catch(() => null)]); } catch (e) { app.innerHTML = `<div class="card">Error: ${esc(e.message)}</div>`; return; }
  state.users = users; updateBadges();
  const f = state.users_filter; const count = r => users.filter(u => u.role === r).length; const inactive = users.filter(u => !u.is_active).length;
  const rows = users.filter(u => (f.role === 'all' || (f.role === 'inactive' ? !u.is_active : u.role === f.role)) && (!f.q || u.username.toLowerCase().includes(f.q.toLowerCase())));
  const lock = sec && sec.active_lockouts && sec.active_lockouts.length ? sec.active_lockouts : [];
  app.innerHTML = `<div class="topbar"><div><div class="eyebrow">Users · admin only · ${users.length} account${users.length === 1 ? '' : 's'}</div><h1>Users</h1><p class="lede"><strong>admin</strong> manages everything including users, <strong>editor</strong> manages models, RAG stores and the projects it belongs to, <strong>viewer</strong> is read-only. Deactivated users cannot sign in and lose their sessions.</p></div>
    <div class="actions"><button class="btn primary" id="addUser">${ICON.plus} Add user</button></div></div>
    <div class="stats four">
      <div class="stat"><div class="l">Admins</div><div class="v">${count('admin')}</div><div class="d">last active admin is protected</div></div>
      <div class="stat"><div class="l">Editors</div><div class="v">${count('editor')}</div><div class="d">across ${state.projects.length} project${state.projects.length === 1 ? '' : 's'}</div></div>
      <div class="stat"><div class="l">Viewers</div><div class="v">${count('viewer')}</div><div class="d">${inactive ? `${inactive} inactive account${inactive === 1 ? '' : 's'}` : 'read-only'}</div></div>
      <div class="stat"><div class="l">Failed logins · 1h</div><div class="v">${sec ? fmtN(sec.failed_last_hour) : '—'}</div><div class="d ${lock.length ? 'down' : ''}">${sec ? (lock.length ? `${lock.length} lockout${lock.length === 1 ? '' : 's'} active · ${esc(lock[0].username)} @ ${esc(lock[0].ip)}` : `${fmtN(sec.failed_last_24h)} in 24h · no lockouts`) : 'unavailable'}</div></div></div>
    <section class="card"><div class="card-head"><div class="row wrap"><div class="search" style="width:300px">${ICON.search}<label for="u-q" class="sr">Search users</label><input id="u-q" class="input" placeholder="Search username" value="${esc(f.q)}" style="min-height:38px" autocomplete="off"></div>
        <div class="tabs" role="tablist" aria-label="Filter">${['all', 'admin', 'editor', 'viewer', 'inactive'].map(r => `<button class="tab" role="tab" data-role-filter="${r}" aria-selected="${f.role === r}">${r}</button>`).join('')}</div></div><span class="hint">${rows.length} of ${users.length} users</span></div>
      <div class="tbl"><table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last login</th><th>Created</th><th></th></tr></thead><tbody>
      ${rows.map(u => `<tr><td><div class="row" style="gap:10px">${avatar(u.username, 'sm')}<div><div style="font-weight:500">${esc(u.username)}</div><div class="hint">${[u.id === state.user.id ? 'you' : '', `${u.project_count || 0} project${u.project_count === 1 ? '' : 's'}`, u.active_sessions ? `${u.active_sessions} session${u.active_sessions === 1 ? '' : 's'}` : ''].filter(Boolean).join(' · ')}</div></div></div></td>
        <td><span class="pill ${u.role === 'admin' ? 'warn' : u.role === 'editor' ? 'info' : ''}">${esc(u.role)}</span></td><td>${u.is_active ? '<span class="pill ok">active</span>' : '<span class="pill err">inactive</span>'}</td><td class="mono muted nowrap">${u.last_login_at ? fmtDay(u.last_login_at) : 'never'}</td><td class="mono muted nowrap">${fmtMonthDay(u.created_at)}</td>
        <td class="right nowrap"><button class="btn sm ghost" data-edit="${u.id}">Edit</button> <button class="btn sm ghost" data-reset="${u.id}">Reset password</button> <button class="btn sm ghost" data-revoke="${u.id}">Revoke sessions</button> <button class="btn sm ghost danger" data-del="${u.id}" ${u.id === state.user.id ? 'disabled' : ''}>Delete</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">No users match.</td></tr>'}</tbody></table></div></section>`;
  const reload = async () => { await loadAll(); render(); };
  let qTimer; $('#u-q').oninput = e => { f.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(renderUsers, 200); };
  on(app, '[data-role-filter]', 'click', b => { f.role = b.dataset.roleFilter; renderUsers(); });
  $('#addUser').onclick = () => { const form = drawer({ eyebrow: 'New', title: 'User', submitLabel: 'Create user', body: `
      ${field('username', 'Username', input('username', '', 'required autocomplete=off autocapitalize=none spellcheck=false maxlength=64'), 'Up to 64 characters; matched case-insensitively at sign-in.')}
      ${field('password', 'Password', input('password', '', 'type=password required minlength=8 maxlength=72 autocomplete=new-password'), strengthMeter('upw'))}
      ${roleCards('viewer')}
      <div class="field"><span class="field"><label>Add to projects</label></span>${checklist('project_ids', state.projects.map(p => ({ value: p.id, label: p.name })), [], 'No projects yet.')}</div>`,
      onSubmit: async (d, fm) => { const project_ids = checkedValues(fm, 'project_ids'); await api('/users', { method: 'POST', body: { username: d.username, password: d.password, role: d.role, ...(project_ids.length ? { project_ids } : {}) } }); toast('User created', 3000, 'ok'); await reload(); } });
    bindStrength($('[name=password]', form), 'upw', 8); };
  on(app, '[data-edit]', 'click', b => { const u = users.find(x => x.id == b.dataset.edit);
    drawer({ eyebrow: 'Edit', title: u.username, submitLabel: 'Save', body: `${roleCards(u.role)}${toggle('is_active', u.is_active, 'Active', 'Inactive users cannot sign in and lose their sessions.')}`,
      onSubmit: async d => { await api('/users/' + u.id, { method: 'PUT', body: { role: d.role, is_active: d.is_active } }); toast('Saved', 3000, 'ok'); if (u.id === state.user.id) state.user = await api('/me'); await reload(); } }); });
  on(app, '[data-reset]', 'click', b => { const u = users.find(x => x.id == b.dataset.reset);
    const form = drawer({ eyebrow: 'Reset password', title: u.username, submitLabel: 'Reset password', body: `${field('new_password', 'New password', input('new_password', '', 'type=password required minlength=8 maxlength=72 autocomplete=new-password'), strengthMeter('rpw'))}<p class="hint">All sessions of this user are revoked.</p>`,
      onSubmit: async d => { await api(`/users/${u.id}/reset-password`, { method: 'POST', body: { new_password: d.new_password } }); toast('Password reset', 3000, 'ok'); } });
    bindStrength($('[name=new_password]', form), 'rpw', 8); });
  on(app, '[data-revoke]', 'click', async b => { if (!await confirmDialog('Sign this user out everywhere?', { label: 'Revoke sessions' })) return; try { await api(`/users/${b.dataset.revoke}/sessions/revoke`, { method: 'POST' }); toast('Sessions revoked', 3000, 'ok'); renderUsers(); } catch (e) { toast(e.message, 5000, 'err'); } });
  on(app, '[data-del]', 'click', async b => { if (!await confirmDialog('Delete this user? Their sessions and project memberships are removed; audit entries keep the username.', { label: 'Delete user' })) return; try { await api('/users/' + b.dataset.del, { method: 'DELETE' }); toast('Deleted', 3000, 'ok'); await reload(); } catch (e) { toast(e.message, 5000, 'err'); } });
}

// ---------------------------------------------------------------------------
// audit log (admin)
// ---------------------------------------------------------------------------
const auditState = { rows: [], total: 0, action: '', actor: '', range: '', done: false, loading: false };
const QUICK = ['login.failure', 'login.locked', 'project.rotate_key', 'user.update', 'model.update', 'setup.complete'];
const actionCls = a => /fail|locked|rate_limited|delete/.test(a) ? 'err' : /rotate|reset|revoke|reprocess/.test(a) ? 'warn' : /create|success|upload/.test(a) ? 'ok' : /setup|export/.test(a) ? 'violet' : /update|members|change|test/.test(a) ? 'info' : '';
function auditQuery(extra = {}) {
  const q = new URLSearchParams(extra); if (auditState.action) q.set('action', auditState.action); if (auditState.actor) q.set('actor_user_id', auditState.actor);
  const hours = { '24h': 24, '7d': 168, '30d': 720 }[auditState.range]; if (hours) q.set('since', new Date(Date.now() - hours * 3600e3).toISOString());
  return q;
}
async function renderAudit() {
  const app = $('#app'); const s = auditState;
  const actors = state.users.length ? state.users : [];
  app.innerHTML = `<div class="topbar"><div><div class="eyebrow">Audit · admin only</div><h1>Audit log</h1><p class="lede">Every create, update, delete, key rotation, login and password change, with actor, target and source address.</p></div>
    <div class="actions"><a class="btn" id="exportLink" href="/admin/api/audit/export?${auditQuery()}">${ICON.download} Export NDJSON</a></div></div>
    <section class="card stack" style="gap:14px">
      <form class="row wrap" id="auditFilter" style="gap:10px"><div class="search grow">${ICON.search}<label for="a-q" class="sr">Filter by action prefix</label><input id="a-q" class="input" name="action" placeholder="action prefix, e.g. login. or project.create" value="${esc(s.action)}" autocomplete="off"></div>
        <select class="input" name="actor" style="width:200px" aria-label="Actor"><option value="">any actor</option>${actors.map(u => `<option value="${u.id}" ${String(u.id) === String(s.actor) ? 'selected' : ''}>${esc(u.username)}</option>`).join('')}</select>
        <select class="input" name="range" style="width:180px" aria-label="Range"><option value="">all time</option>${[['24h', 'last 24 hours'], ['7d', 'last 7 days'], ['30d', 'last 30 days']].map(([v, l]) => `<option value="${v}" ${s.range === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <button class="btn">Filter</button></form>
      <div class="row wrap" style="gap:8px"><span class="hint">Quick:</span>${QUICK.map(a => `<button type="button" class="chip ${s.action === a ? 'on' : ''}" data-quick="${a}">${a}</button>`).join('')}</div>
      <div class="tbl"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>IP</th><th>Details</th></tr></thead><tbody id="auditRows"></tbody></table></div>
      <div class="row between" style="border-top:1px solid var(--line);padding-top:12px"><span class="hint mono" id="auditInfo"></span><button class="btn sm" id="auditMore">Load 100 more</button></div></section>`;
  const draw = () => {
    $('#auditRows').innerHTML = s.rows.map(a => { const det = a.details ? JSON.stringify(a.details) : ''; const tname = a.details && a.details.name ? ` · ${a.details.name}` : ''; return `<tr><td class="mono muted nowrap" title="${esc(fmtDate(a.created_at))}">${fmtDay(a.created_at)}</td>
      <td><div class="row" style="gap:8px">${a.actor_username ? avatar(a.actor_username, 'xs') : '<div class="avatar xs" style="background:#2a3242;color:var(--tx2)" aria-hidden="true">?</div>'}<span>${esc(a.actor_username || '—')}</span></div></td>
      <td><code class="pill ${actionCls(a.action)}">${esc(a.action)}</code></td><td class="dim">${esc(a.target_type)}${a.target_id != null ? ' #' + a.target_id : ''}${esc(tname)}</td><td class="mono muted">${esc(a.ip)}</td><td class="json" title="${esc(det)}">${esc(det)}</td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">No entries.</td></tr>';
    $('#auditMore').disabled = s.done || s.loading; $('#auditInfo').textContent = `${fmtN(s.rows.length)} of ${fmtN(s.total)} entries · newest first`;
    const link = $('#exportLink'); if (link) link.href = '/admin/api/audit/export?' + auditQuery();
  };
  const load = async more => { if (s.loading) return; s.loading = true;
    try { const q = auditQuery({ limit: '100' }); if (more && s.rows.length) q.set('before', s.rows[s.rows.length - 1].created_at);
      const res = await api('/audit?' + q); const rows = res.entries || []; s.rows = more ? s.rows.concat(rows) : rows; s.total = res.total || 0; s.done = !res.has_more; }
    catch (e) { toast(e.message, 5000, 'err'); } finally { s.loading = false; if (state.tab === 'audit' && $('#auditRows')) draw(); } };
  $('#auditFilter').onsubmit = e => { e.preventDefault(); const f = e.target; s.action = f.action.value.trim(); s.actor = f.actor.value; s.range = f.range.value; $$('[data-quick]', app).forEach(c => c.classList.toggle('on', c.dataset.quick === s.action)); load(false); };
  on(app, '[data-quick]', 'click', c => { s.action = s.action === c.dataset.quick ? '' : c.dataset.quick; $('#a-q').value = s.action; $$('[data-quick]', app).forEach(x => x.classList.toggle('on', x.dataset.quick === s.action)); load(false); });
  $('#auditMore').onclick = () => load(true);
  await load(false);
}

// ---------------------------------------------------------------------------
// boot
// ---------------------------------------------------------------------------
(async function init() {
  try { const me = await api('/me'); state.user = me; state.sessionExp = me.session_expires_at || null; } catch (e) { state.user = null; if (e.message !== 'session expired') toast('Could not load session: ' + e.message, 5000, 'err'); }
  if (state.user) { try { await loadAll(); } catch (e) { toast(e.message, 5000, 'err'); } }
  else { try { const s = await api('/setup'); state.setup = s; state.needsSetup = !!s.needs_setup; } catch (e) { state.needsSetup = false; } }
  render();
})();
</script>
