<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ragmux Gateway</title>
<style>
  :root{
    --bg:#f6f7f9;--panel:#fff;--border:#e3e6ea;--text:#1c2027;--muted:#6b7280;
    --accent:#2563eb;--accent-2:#1d4ed8;--danger:#dc2626;--ok:#16a34a;--warn:#d97706;--code:#f1f3f6;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f1115;--panel:#171a21;--border:#262b35;--text:#e6e8ec;--muted:#9aa3b2;--accent:#3b82f6;--accent-2:#60a5fa;--code:#0b0d11}
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--accent)}
  header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0 12px 0 0;letter-spacing:.3px}
  header nav{display:flex;gap:4px;flex-wrap:wrap}
  header nav button{background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--muted);cursor:pointer;font:inherit}
  header nav button.active{background:var(--bg);color:var(--text);font-weight:600}
  header .spacer{flex:1}
  main{max-width:1180px;margin:0 auto;padding:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .row.between{justify-content:space-between}
  h2{font-size:18px;margin:0 0 12px}
  h3{font-size:14px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px}
  tr:last-child td{border-bottom:0}
  .tbl{overflow-x:auto}
  button,.btn{font:inherit;padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-2)}
  button.danger{color:var(--danger)}
  button.small{padding:4px 8px;font-size:12px}
  button:disabled{opacity:.5;cursor:default}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);width:100%}
  textarea{min-height:90px;resize:vertical}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .field{margin-bottom:12px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .stat{padding:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
  .stat .v{font-size:22px;font-weight:700}
  .stat .l{font-size:12px;color:var(--muted)}
  code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  pre{background:var(--code);padding:10px;border-radius:6px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  code{background:var(--code);padding:1px 5px;border-radius:4px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--code);color:var(--muted)}
  .pill.ready,.pill.ok{background:#dcfce7;color:#166534}
  .pill.failed,.pill.err{background:#fee2e2;color:#991b1b}
  .pill.processing,.pill.pending{background:#fef3c7;color:#92400e}
  .muted{color:var(--muted)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:10;overflow:auto}
  .modal{background:var(--panel);border-radius:10px;width:100%;max-width:560px;padding:20px;border:1px solid var(--border)}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:20;max-width:420px;white-space:pre-wrap}
  .login{max-width:360px;margin:80px auto}
  .bars{display:flex;align-items:flex-end;gap:4px;height:80px}
  .bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
  .bars div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
  .chat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding:8px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
  .msg{padding:8px 10px;border-radius:8px;max-width:85%;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff}
  .msg.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--border)}
  .meter{height:8px;background:var(--code);border-radius:4px;overflow:hidden;margin-top:6px}
  .meter div{height:100%;background:var(--ok);border-radius:4px}
  .meter div.warn{background:var(--warn)}
  .meter div.err{background:var(--danger)}
  .hidden{display:none}
  select[multiple]{min-height:110px}
  td.json{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;max-width:360px;word-break:break-all}
</style>
</head>
<body>
<header>
  <h1>⛩ Ragmux</h1>
  <nav id="nav" class="hidden">
    <button data-tab="overview">Overview</button>
    <button data-tab="models">Models</button>
    <button data-tab="rag">RAG Stores</button>
    <button data-tab="projects">Projects</button>
    <button data-tab="playground">Playground</button>
    <button data-tab="users" data-role="admin">Users</button>
    <button data-tab="audit" data-role="admin">Audit</button>
  </nav>
  <div class="spacer"></div>
  <span id="whoami" class="muted"></span>
  <button id="btnPassword" class="small hidden">Password</button>
  <button id="btnLogout" class="small hidden">Logout</button>
</header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast" class="toast hidden"></div>

<script>
'use strict';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => (n ?? 0).toLocaleString();
const fmtDate = s => s ? new Date(s).toLocaleString() : '';
const state = { user:null, needsSetup:false, tab:'overview', models:[], rag:[], projects:[], providerTypes:[], users:[], playground:{key:'', msgs:[]} };
const ROLE_RANK = { viewer:1, editor:2, admin:3 };
// can('editor') is true for editors and admins; the API enforces the same matrix.
const can = role => !!state.user && (ROLE_RANK[state.user.role]||0) >= (ROLE_RANK[role]||99);
const userName = id => (state.users.find(u=>u.id===id)||{}).username || '#'+id;
// Compact "2 rpm · 10k tpm · 1M/day" summary of a project's non-zero limits.
const fmtK = n => n>=1e6 ? (n/1e6).toFixed(n%1e6?1:0)+'M' : n>=1e3 ? (n/1e3).toFixed(n%1e3?1:0)+'k' : String(n);
const limitSummary = p => [p.rate_limit_rpm?`${fmtK(p.rate_limit_rpm)} rpm`:'', p.rate_limit_tpm?`${fmtK(p.rate_limit_tpm)} tpm`:'', p.budget_daily_tokens?`${fmtK(p.budget_daily_tokens)}/day`:'', p.budget_monthly_tokens?`${fmtK(p.budget_monthly_tokens)}/month`:''].filter(Boolean).join(' · ');
const meter = pct => `<div class="meter"><div class="${pct>=100?'err':pct>=80?'warn':''}" style="width:${Math.min(100,pct)}%"></div></div>`;

let toastTimer;
function toast(msg, ms=3500){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.add('hidden'), ms); }

async function api(path, opts={}){
  const o = { headers:{}, ...opts };
  if (o.body && !(o.body instanceof FormData)) { o.headers['Content-Type']='application/json'; o.body = JSON.stringify(o.body); }
  const r = await fetch('/admin/api'+path, o);
  if (r.status === 401 && !path.startsWith('/login')) { state.user=null; render(); throw new Error('session expired'); }
  const ct = r.headers.get('content-type')||'';
  const data = ct.includes('json') ? await r.json() : await r.text();
  if (r.status === 403) { const msg=(data && data.error && data.error.message) || 'forbidden'; toast('Not allowed: '+msg); throw new Error(msg); }
  if (!r.ok) throw new Error((data && data.error && data.error.message) || r.statusText);
  return data;
}

// ---------- modal / forms ----------
function modal(title, bodyHtml, onSubmit, submitLabel='Save'){
  const root = $('#modal');
  root.innerHTML = `<div class="modal-bg"><form class="modal"><h2>${esc(title)}</h2>${bodyHtml}
    <div class="row" style="justify-content:flex-end;margin-top:8px"><button type="button" id="mCancel">Cancel</button><button class="primary" type="submit">${esc(submitLabel)}</button></div></form></div>`;
  const form = $('form', root);
  $('#mCancel').onclick = closeModal;
  $('.modal-bg', root).addEventListener('click', e => { if (e.target.classList.contains('modal-bg')) closeModal(); });
  form.onsubmit = async e => { e.preventDefault(); const btn=$('button[type=submit]', form); btn.disabled=true;
    try { await onSubmit(Object.fromEntries(new FormData(form).entries()), form); closeModal(); } catch(err){ toast('Error: '+err.message); } finally { btn.disabled=false; } };
  return form;
}
function closeModal(){ $('#modal').innerHTML=''; }
const field = (label, inner) => `<div class="field"><label>${esc(label)}</label>${inner}</div>`;
const input = (name, val='', attrs='') => `<input name="${name}" value="${esc(val)}" ${attrs}>`;
const select = (name, opts, val) => `<select name="${name}">${opts.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(val)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
const multiSelect = (name, opts, vals=[]) => `<select name="${name}" multiple>${opts.map(o=>`<option value="${esc(o.value)}" ${vals.map(String).includes(String(o.value))?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
const ROLES = [{value:'viewer',label:'viewer — read only'},{value:'editor',label:'editor — manage models, RAG and own projects'},{value:'admin',label:'admin — everything incl. users'}];
async function confirmDialog(msg){ return new Promise(res => { modal('Confirm', `<p>${esc(msg)}</p>`, async()=>res(true), 'Confirm'); $('#mCancel').addEventListener('click', ()=>res(false)); }); }

// ---------- first-run setup ----------
// Shown instead of the login form while the users table is empty (GET
// /setup says needs_setup). The server refuses the request once any user
// exists, so a stale page cannot create a second administrator.
function renderSetup(app){
  app.innerHTML = `<div class="card login"><h2>Create the first administrator</h2>
    <p class="muted">No accounts exist yet. This account gets the admin role; you can add more users afterwards.</p>
    <form id="setupForm">
      ${field('Username', input('username','','required autocomplete=username pattern="[a-z0-9._-]{3,64}" title="3-64 characters: a-z, 0-9, . _ -"'))}
      ${field('Password (min 12)', input('password','','type=password required minlength=12 maxlength=72 autocomplete=new-password'))}
      ${field('Confirm password', input('confirm','','type=password required minlength=12 maxlength=72 autocomplete=new-password'))}
      <button class="primary" style="width:100%">Create administrator</button></form></div>`;
  $('#setupForm').onsubmit = async e => { e.preventDefault(); const d=Object.fromEntries(new FormData(e.target).entries());
    if (d.password !== d.confirm) { toast('Passwords do not match'); return; }
    const btn=$('button', e.target); btn.disabled=true;
    try { const r = await api('/setup',{method:'POST',body:{username:d.username, password:d.password}}); state.needsSetup=false; state.user=r.user; await loadAll(); render(); }
    catch(err){ toast(err.message); if (/already completed/.test(err.message)) { state.needsSetup=false; render(); } }
    finally { btn.disabled=false; } };
}

// ---------- render ----------
function render(){
  const nav=$('#nav'); const app=$('#app');
  if (!state.user){ nav.classList.add('hidden'); $('#btnLogout').classList.add('hidden'); $('#btnPassword').classList.add('hidden'); $('#whoami').textContent='';
    if (state.needsSetup){ renderSetup(app); return; }
    app.innerHTML = `<div class="card login"><h2>Sign in</h2><form id="loginForm">
      ${field('Username', input('username','admin','autocomplete=username'))}
      ${field('Password', input('password','','type=password autocomplete=current-password'))}
      <button class="primary" style="width:100%">Sign in</button></form></div>`;
    $('#loginForm').onsubmit = async e => { e.preventDefault(); const d=Object.fromEntries(new FormData(e.target).entries());
      try { const r = await api('/login',{method:'POST',body:d}); state.user=r.user; await loadAll(); render(); } catch(err){ toast(err.message); } };
    return;
  }
  nav.classList.remove('hidden'); $('#btnLogout').classList.remove('hidden'); $('#btnPassword').classList.remove('hidden');
  $('#whoami').textContent = `${state.user.username} · ${state.user.role}`;
  nav.querySelectorAll('button').forEach(b => { b.classList.toggle('active', b.dataset.tab===state.tab); b.classList.toggle('hidden', !!b.dataset.role && !can(b.dataset.role)); });
  const tabs = {overview:renderOverview, models:renderModels, rag:renderRAG, projects:renderProjects, playground:renderPlayground, users:renderUsers, audit:renderAudit};
  if (!tabs[state.tab]) state.tab='overview';
  tabs[state.tab]();
}

async function loadAll(){
  [state.models, state.rag, state.projects, state.providerTypes] = await Promise.all([api('/models'), api('/rag-stores'), api('/projects'), api('/provider-types')]);
  // Editors and admins can list users (for project members); viewers cannot.
  state.users = can('editor') ? await api('/users/lite').catch(()=>[]) : [];
}
const modelName = id => (state.models.find(m=>m.id===id)||{}).name || '#'+id;
const ragName = id => id ? ((state.rag.find(r=>r.id===id)||{}).name || '#'+id) : '—';

// ---------- overview ----------
async function renderOverview(){
  const app=$('#app'); app.innerHTML='<div class="card">Loading…</div>';
  let m, sys;
  try { [m, sys] = await Promise.all([api('/metrics/summary?window=24h'), api('/system')]); } catch(e){ app.innerHTML=`<div class="card">Error: ${esc(e.message)}</div>`; return; }
  const w=m.window, t=m.total;
  const maxReq = Math.max(1, ...m.daily.map(d=>d.requests));
  app.innerHTML = `
    <div class="card"><div class="row between"><h2>Last 24 hours</h2><span class="muted">PostgreSQL ${esc(sys.database.postgres_version)} · pgvector ${esc(sys.database.pgvector_version)} · DB ${(sys.database.size_bytes/1048576).toFixed(2)} MB (${fmtN(sys.backup.tables)} vector table${sys.backup.tables===1?'':'s'}, docs ${(sys.backup.documents_bytes/1048576).toFixed(2)} MB) · key: ${esc(sys.secret_key_source)} · v${esc(sys.version)}</span></div>
      <div class="grid">
        <div class="stat"><div class="v">${fmtN(w.requests)}</div><div class="l">requests (${fmtN(w.errors)} errors)</div></div>
        <div class="stat"><div class="v">${fmtN(w.prompt_tokens)}</div><div class="l">prompt tokens</div></div>
        <div class="stat"><div class="v">${fmtN(w.completion_tokens)}</div><div class="l">completion tokens</div></div>
        <div class="stat"><div class="v">${Math.round(w.avg_latency_ms)} ms</div><div class="l">avg latency · p95 ${fmtN(w.p95_latency_ms)} ms</div></div>
        <div class="stat"><div class="v">${fmtN(w.rag_requests)}</div><div class="l">RAG-augmented</div></div>
        <div class="stat"><div class="v">${fmtN(w.rate_limited)}</div><div class="l">rate limited (429)</div></div>
      </div></div>
    <div class="card"><h3>Requests per day (14d) · all time: ${fmtN(t.requests)} req / ${fmtN(t.prompt_tokens+t.completion_tokens)} tokens</h3>
      <div class="bars" style="margin-bottom:22px">${m.daily.length?m.daily.map(d=>`<div style="height:${Math.max(2,100*d.requests/maxReq)}%" title="${d.day}: ${d.requests} req, ${d.errors} err"><span>${d.day.slice(5)}</span></div>`).join(''):'<span class="muted">No requests yet.</span>'}</div></div>
    <div class="card"><h3>Recent requests</h3><div class="tbl"><table><thead><tr><th>Time</th><th>Project</th><th>Model</th><th>Status</th><th>Tokens (p/c)</th><th>Latency</th><th>Flags</th><th>Error</th></tr></thead>
      <tbody>${m.recent.map(r=>`<tr><td>${fmtDate(r.created_at)}</td><td>${esc((state.projects.find(p=>p.id===r.project_id)||{}).name||'#'+r.project_id)}</td><td>${esc(r.model_name)}</td>
        <td><span class="pill ${r.status_code<400?'ok':'err'}">${r.status_code}</span></td><td>${fmtN(r.prompt_tokens)} / ${fmtN(r.completion_tokens)}${r.estimated?' <span class="muted">~</span>':''}</td><td>${fmtN(r.latency_ms)} ms</td>
        <td>${r.streamed?'<span class="pill">stream</span> ':''}${r.rag_used?'<span class="pill">rag</span>':''}</td><td class="muted">${esc(r.error)}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No requests yet.</td></tr>'}</tbody></table></div></div>`;
}

// ---------- models ----------
function renderModels(){
  const app=$('#app');
  const w = can('editor');
  app.innerHTML = `<div class="card"><div class="row between"><h2>Model connections</h2>${w?'<button class="primary" id="addModel">+ Add connection</button>':''}</div>
    <p class="muted">Provider credentials are encrypted at rest and never exposed to API clients; projects use their own <code>sk-proj-…</code> keys.</p>
    <div class="tbl"><table><thead><tr><th>Name</th><th>Provider</th><th>Model</th><th>Base URL</th><th>Key</th><th></th></tr></thead><tbody>
    ${state.models.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td><span class="pill">${esc(m.provider_type)}</span></td><td><code>${esc(m.model_name)}</code></td><td class="muted">${esc(m.base_url||'(default)')}</td><td class="muted">${esc(m.api_key_masked||'—')}</td>
      <td style="white-space:nowrap"><button class="small" data-test="${m.id}">Test chat</button> <button class="small" data-testemb="${m.id}">Test embed</button>${w?` <button class="small" data-edit="${m.id}">Edit</button> <button class="small danger" data-del="${m.id}">Delete</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No connections yet.</td></tr>'}
    </tbody></table></div></div>`;
  if (w) $('#addModel').onclick = () => modelForm();
  app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>modelForm(state.models.find(m=>m.id==b.dataset.edit)));
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!await confirmDialog('Delete this connection? Projects and RAG stores using it must be reassigned first.')) return;
    try{ await api('/models/'+b.dataset.del,{method:'DELETE'}); toast('Deleted'); await loadAll(); render(); }catch(e){ toast(e.message); } });
  const test = async (id, mode) => { toast('Testing…', 60000); try{ const r=await api('/models/'+id+'/test',{method:'POST',body:{mode}});
    toast(r.ok ? `OK in ${r.latency_ms} ms` + (r.reply?`\nreply: ${r.reply}`:'') + (r.dimensions?`\ndimensions: ${r.dimensions}`:'') : `Failed: ${r.error}`, 8000); }catch(e){ toast(e.message); } };
  app.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>test(b.dataset.test,'chat'));
  app.querySelectorAll('[data-testemb]').forEach(b=>b.onclick=()=>test(b.dataset.testemb,'embedding'));
}
function modelForm(m){
  const types = state.providerTypes.map(t=>({value:t.type,label:t.label}));
  const form = modal(m?'Edit connection':'New connection', `
    ${field('Name', input('name', m?.name||'', 'required placeholder="e.g. openai-gpt4o"'))}
    ${field('Provider type', select('provider_type', types, m?.provider_type||'openai'))}
    ${field('Base URL (blank = provider default)', input('base_url', m?.base_url||'', 'placeholder="https://…"'))}
    ${field(m?'API key (blank = keep current)':'API key / token', input('api_key','', 'type=password autocomplete=off'))}
    ${field('Target model name', input('model_name', m?.model_name||'', 'required placeholder="gpt-4o, claude-sonnet-4-5, qwen2.5:7b …"'))}
    <p class="muted" id="ptHint"></p>`,
    async d => { if (m) await api('/models/'+m.id,{method:'PUT',body:d}); else await api('/models',{method:'POST',body:d}); toast('Saved'); await loadAll(); render(); });
  const hint = () => { const t=state.providerTypes.find(x=>x.type===$('[name=provider_type]',form).value); if(!t) return;
    $('#ptHint').textContent = `Default URL: ${t.default_base_url}. ${t.supports_embeddings?'Can serve embeddings for RAG stores.':'No embeddings API.'} ${t.requires_api_key?'API key required.':'API key optional.'}`;
    if(!m && !$('[name=base_url]',form).value && (t.type==='custom_openai'||t.type==='ollama')) $('[name=base_url]',form).placeholder=t.default_base_url; };
  $('[name=provider_type]',form).onchange=hint; hint();
}

// ---------- RAG ----------
let openStore = null;
function renderRAG(){
  const app=$('#app');
  const embModels = state.models.filter(m => (state.providerTypes.find(t=>t.type===m.provider_type)||{}).supports_embeddings);
  const w = can('editor');
  app.innerHTML = `<div class="card"><div class="row between"><h2>RAG stores</h2>${w?`<button class="primary" id="addStore" ${embModels.length?'':'disabled title="Add an embedding-capable model connection first"'}>+ Add store</button>`:''}</div>
    <div class="tbl"><table><thead><tr><th>Name</th><th>Embedding model</th><th>Chunking</th><th>Top-k</th><th>Retrieval</th><th>Dims</th><th>Docs / chunks</th><th>Quota</th><th></th></tr></thead><tbody>
    ${state.rag.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(modelName(r.embedding_connection_id))}</td><td>${r.chunk_size} / ${r.chunk_overlap}${r.contextual_chunks?' <span class="pill" title="Contextual chunks: filename and section are embedded with the text">ctx</span>':''}</td><td>${r.top_k}</td><td class="muted" style="white-space:nowrap">${esc(retrievalSummary(r))}</td><td>${r.dimensions||'—'}</td><td>${r.document_count} / ${r.chunk_count}</td><td class="muted" style="white-space:nowrap" title="documents / max · MB used / max (∞ = unlimited)">${esc(quotaSummary(r))}</td>

// "hybrid (english) · rerank 15 · dist ≤ 0.6" summary of a store's retrieval settings.
const retrievalSummary = r => [r.search_mode==='vector'?'vector':`hybrid (${r.fts_config||'simple'})`, r.rerank?`rerank ${r.rerank_candidates}`:'', r.max_distance?`dist ≤ ${r.max_distance}`:''].filter(Boolean).join(' · ');
// "3/10 docs · 1.2/50 MB" usage against the store's own quotas (∞ = unlimited).
const mb = b => (b/1048576).toFixed(b && b < 1048576 ? 2 : 1);
const quotaSummary = r => `${r.document_count}/${r.max_documents||'∞'} docs · ${mb(r.bytes_used||0)}/${r.max_bytes?mb(r.max_bytes):'∞'} MB`;
const checkbox = (name, checked, label) => `<label class="row" style="gap:6px;align-items:center;font-weight:normal"><input type="checkbox" name="${name}" ${checked?'checked':''} style="width:auto">${esc(label)}</label>`;

let pollTimer;
async function renderStorePanel(){

      <td style="white-space:nowrap">${w?`<button class="small" data-re="${d.id}">Reprocess</button> <button class="small danger" data-del="${d.id}">Delete</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No documents. Upload PDF, DOCX, HTML, TXT or Markdown files.</td></tr>'}
    </tbody></table></div>
    <h3 style="margin-top:16px">Test retrieval</h3>
    <form id="srch" class="row"><input name="q" placeholder="Ask something that should be in the documents…" style="flex:1">
      ${select('mode', [{value:'hybrid',label:'hybrid'},{value:'vector',label:'vector'}], r.search_mode||'hybrid').replace('<select','<select style="width:auto"')}
      ${checkbox('rerank', !!r.rerank, 'rerank')}
      <button>Search</button></form>
    <div id="hits"></div></div>`;
  if (w) $('#upl').onsubmit = async e => { e.preventDefault(); const fd=new FormData(e.target); const btn=$('button',e.target); btn.disabled=true;
    try{ await api(`/rag-stores/${r.id}/documents`,{method:'POST',body:fd}); toast('Uploaded; processing in background'); await loadAll(); renderStorePanel(); }catch(err){ toast(err.message); } finally{ btn.disabled=false; } };
  panel.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!await confirmDialog('Delete this document and its vectors?')) return; try{ await api('/documents/'+b.dataset.del,{method:'DELETE'}); await loadAll(); renderStorePanel(); }catch(e){ toast(e.message); } });
  panel.querySelectorAll('[data-re]').forEach(b=>b.onclick=async()=>{ try{ await api('/documents/'+b.dataset.re+'/reprocess',{method:'POST'}); toast('Queued'); setTimeout(renderStorePanel,800); }catch(e){ toast(e.message); } });
  if (w) $('#reAll').onclick = async () => { if(!await confirmDialog('Re-parse, re-chunk and re-embed every document in this store? This calls the embedding model for all chunks again.')) return;
    try{ const res=await api(`/rag-stores/${r.id}/reprocess`,{method:'POST'}); toast(`Queued ${res.documents} document(s)`); setTimeout(renderStorePanel,800); }catch(e){ toast(e.message); } };
  $('#srch').onsubmit = async e => { e.preventDefault(); const f=e.target; const q=$('[name=q]',f).value; if(!q) return; $('#hits').innerHTML='<p class="muted">Searching…</p>';
    try{ const res=await api(`/rag-stores/${r.id}/search`,{method:'POST',body:{query:q, mode:$('[name=mode]',f).value, rerank:$('[name=rerank]',f).checked}});
      const where = h => [h.section, h.page?`p.${h.page}`:''].filter(Boolean).join(' · ');
      $('#hits').innerHTML = `<p class="muted">${res.hits.length} hits in ${res.latency_ms} ms · ${esc(res.mode)}${res.reranked?' · reranked':''}</p>` + res.hits.map((h,i)=>`<div class="card" style="padding:10px"><div class="row between"><b>[${i+1}] ${esc(h.filename)}${where(h)?` · ${esc(where(h))}`:''} <span class="muted">(chunk ${h.index})</span></b>
        <span class="muted">score ${h.score.toFixed(4)} · vector #${h.vector_rank||'—'} · fts #${h.fts_rank||'—'} · distance ${h.distance.toFixed(4)}</span></div><pre>${esc(h.content)}</pre></div>`).join(''); }
    catch(err){ $('#hits').innerHTML=`<p class="muted">Error: ${esc(err.message)}</p>`; } };
  clearTimeout(pollTimer);
  if (docs.some(d=>d.status==='pending'||d.status==='processing')) pollTimer=setTimeout(async()=>{ if(state.tab==='rag'&&openStore===r.id){ await loadAll(); renderStorePanel(); } }, 2500);
}

  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!await confirmDialog('Delete this user? Their sessions and project memberships are removed; audit entries keep the username.')) return; try{ await api('/users/'+b.dataset.del,{method:'DELETE'}); toast('Deleted'); await reload(); }catch(e){ toast(e.message); } });
}

// ---------- audit (admin) ----------
const auditState = { rows:[], action:'', done:false };
async function renderAudit(){
  const app=$('#app');
  app.innerHTML = `<div class="card"><div class="row between"><h2>Audit log</h2>
      <form id="auditFilter" class="row"><input name="action" placeholder="filter by action prefix, e.g. login. or project.create" value="${esc(auditState.action)}" style="width:320px"><button>Filter</button></form></div>
    <div class="tbl"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>IP</th><th>Details</th></tr></thead><tbody id="auditRows"></tbody></table></div>
    <div class="row" style="margin-top:10px"><button id="auditMore">Load more</button><span class="muted" id="auditInfo"></span></div></div>`;
  const draw = () => { $('#auditRows').innerHTML = auditState.rows.map(a=>`<tr><td style="white-space:nowrap">${fmtDate(a.created_at)}</td><td>${esc(a.actor_username||'—')}${a.actor_user_id?` <span class="muted">#${a.actor_user_id}</span>`:''}</td><td><code>${esc(a.action)}</code></td><td class="muted">${esc(a.target_type)}${a.target_id!=null?' #'+a.target_id:''}</td><td class="muted">${esc(a.ip)}</td><td class="json">${esc(JSON.stringify(a.details))}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No entries.</td></tr>';
    $('#auditMore').disabled=auditState.done; $('#auditInfo').textContent=`${auditState.rows.length} entries${auditState.done?' · end':''}`; };
  const load = async (more) => { try{ const q=new URLSearchParams({limit:'100'}); if(auditState.action) q.set('action',auditState.action);
      if(more && auditState.rows.length) q.set('before', auditState.rows[auditState.rows.length-1].created_at);
      const rows=await api('/audit?'+q); auditState.rows = more ? auditState.rows.concat(rows) : rows; auditState.done = rows.length<100; draw(); }catch(e){ toast(e.message); } };
  $('#auditFilter').onsubmit=e=>{ e.preventDefault(); auditState.action=$('[name=action]',e.target).value.trim(); load(false); };
  $('#auditMore').onclick=()=>load(true);
  await load(false);
}

// ---------- playground ----------
function renderPlayground(){
  const app=$('#app'); const pg=state.playground;
  app.innerHTML=`<div class="card"><h2>Playground</h2><p class="muted">Sends real requests to <code>/v1/chat/completions</code> using a project key (only kept in this page's memory).</p>
    <div class="row"><div style="flex:2">${field('Project API key', input('key', pg.key, 'type=password placeholder="sk-proj-…" id="pgKey"'))}</div>
      <div style="flex:1"><label>Streaming</label><select id="pgStream"><option value="1">on</option><option value="0">off</option></select></div>
      <div><label>&nbsp;</label><button id="pgClear">Clear</button></div></div>
    <div class="chat" id="chat">${pg.msgs.map(m=>`<div class="msg ${m.role}">${esc(m.content)}</div>`).join('')||'<span class="muted">No messages yet.</span>'}</div>
    <form id="pgForm" class="row" style="margin-top:10px"><textarea name="text" placeholder="Message… (Enter to send, Shift+Enter for newline)" style="flex:1;min-height:60px"></textarea><button class="primary" id="pgSend">Send</button></form>
    <p class="muted" id="pgInfo"></p></div>`;
  $('#pgKey').oninput=e=>pg.key=e.target.value;
  $('#pgClear').onclick=()=>{ pg.msgs=[]; renderPlayground(); };
  const ta=$('textarea',app); ta.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('#pgForm').requestSubmit(); } };
  $('#pgForm').onsubmit=async e=>{ e.preventDefault(); const text=ta.value.trim(); if(!text||!pg.key){ toast('Enter a project key and a message'); return; }
    ta.value=''; pg.msgs.push({role:'user',content:text}); const asst={role:'assistant',content:''}; pg.msgs.push(asst); renderPlayground(); $('#pgSend').disabled=true;
    const chat=$('#chat'); const last=()=>chat.lastElementChild; const t0=performance.now();
    try{ const stream=$('#pgStream').value==='1';
      const r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+pg.key,'Content-Type':'application/json'},body:JSON.stringify({model:'default',stream,messages:pg.msgs.filter(m=>m.content).map(m=>({role:m.role,content:m.content}))})});
      if(!r.ok){ const err=await r.json().catch(()=>({})); const ra=r.headers.get('Retry-After');
        throw new Error((r.status===429?'429 '+(err.error?.type||'rate limited')+': ':'')+(err.error?.message||r.statusText)+(ra?` (Retry-After: ${ra}s)`:'')); }
      if(stream){ const rd=r.body.getReader(); const dec=new TextDecoder(); let buf=''; let usage=null;
        while(true){ const {done,value}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true}); let i;
          while((i=buf.indexOf('\n\n'))>=0){ const ev=buf.slice(0,i); buf=buf.slice(i+2); for(const line of ev.split('\n')){ if(!line.startsWith('data:')) continue; const d=line.slice(5).trim(); if(d==='[DONE]') continue;
            try{ const j=JSON.parse(d); if(j.error) throw new Error(j.error.message); if(j.usage) usage=j.usage; const c=j.choices?.[0]?.delta?.content; if(c){ asst.content+=c; last().textContent=asst.content; chat.scrollTop=chat.scrollHeight; } }catch(pe){ if(pe.message) asst.content+=`\n[error: ${pe.message}]`; } } } }
        $('#pgInfo').textContent=`${Math.round(performance.now()-t0)} ms` + (usage?` · ${usage.prompt_tokens}/${usage.completion_tokens} tokens`:'');
      } else { const j=await r.json(); asst.content=j.choices?.[0]?.message?.content||''; last().textContent=asst.content; $('#pgInfo').textContent=`${Math.round(performance.now()-t0)} ms · ${j.usage?.prompt_tokens}/${j.usage?.completion_tokens} tokens`; }
    }catch(err){ asst.content=asst.content||`[error: ${err.message}]`; last().textContent=asst.content; }
    finally{ $('#pgSend').disabled=false; } };
}

// ---------- header actions ----------
$('#nav').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; state.tab=b.dataset.tab; render(); });
$('#btnLogout').onclick = async()=>{ try{ await api('/logout',{method:'POST'}); }catch(e){} state.user=null; render(); };
$('#btnPassword').onclick = ()=> modal('Change password', `${field('Current password', input('current_password','','type=password required'))}${field('New password (min 8)', input('new_password','','type=password required minlength=8'))}`,
  async d=>{ await api('/me/password',{method:'POST',body:d}); toast('Password changed'); });

(async function init(){
  try { state.user = await api('/me'); } catch(e) { state.user=null; if (e.message!=='session expired') toast('Could not load session: '+e.message); }
  if (state.user) { try { await loadAll(); } catch(e) { toast(e.message); } }
  else { try { state.needsSetup = !!(await api('/setup')).needs_setup; } catch(e) { state.needsSetup=false; } }
  render();
})();
</script>
