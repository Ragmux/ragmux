# Default deployment: one container with the gateway and its PostgreSQL 17 +
# pgvector server (Dockerfile.aio). All state lives in the ragmux-data volume.
# For a separate or external database use docker-compose.split.yml instead;
# see docs/configuration.md#deployment-layouts.
services:
  ragmux:
    build:
      context: .
      dockerfile: Dockerfile.aio
      args:
        VERSION: ${VERSION:-dev}
    image: ragmux/ragmux:latest
    container_name: ragmux
    restart: unless-stopped
    ports:
      # Bound to loopback: put a TLS-terminating reverse proxy (nginx, Caddy,
      # Traefik) in front and set TRUST_PROXY_HEADERS / SECURE_COOKIES. To
      # expose the gateway directly change this to "8765:8765".
      - "127.0.0.1:8765:8765"
    env_file:
      - path: .env
        required: false
    environment:
      # Nothing is required. SECRET_KEY (openssl rand -hex 32) is recommended:
      # without it the gateway generates /data/ragmux/secret.key inside the
      # volume, which then has to be backed up together with the database.
      SECRET_KEY: ${SECRET_KEY:-}
      PORT: "8765"
      # Set DATABASE_URL to use your own PostgreSQL; the embedded server is
      # then not started (EMBEDDED_POSTGRES=false does the same explicitly).
      DATABASE_URL: ${DATABASE_URL:-}
      EMBEDDED_POSTGRES: ${EMBEDDED_POSTGRES:-}
      PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-128MB}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      # Passed through from the shell or .env; empty values fall back to defaults.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOGIN_RATE_LIMIT_PER_MIN: ${LOGIN_RATE_LIMIT_PER_MIN:-}
      LOGIN_USER_LIMIT_PER_MIN: ${LOGIN_USER_LIMIT_PER_MIN:-}
      LOGIN_LOCKOUT_FAILURES: ${LOGIN_LOCKOUT_FAILURES:-}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-}
      # Outbound SSRF guard: provider base URLs may not point at private or
      # local addresses unless listed here (e.g. "host.docker.internal,ollama")
      # or allowed wholesale.
      PRIVATE_UPSTREAM_ALLOWLIST: ${PRIVATE_UPSTREAM_ALLOWLIST:-}
      ALLOW_PRIVATE_UPSTREAMS: ${ALLOW_PRIVATE_UPSTREAMS:-false}
    volumes:
      # /data/pg is the PostgreSQL cluster, /data/ragmux the secret.key
      # fallback. This volume plus SECRET_KEY is the whole state.
      - ragmux-data:/data
      # The Postgres unix socket, shared with the backup profile only.
      - ragmux-pgsocket:/var/run/postgresql
    healthcheck:
      test: ["CMD", "/usr/local/bin/ragmux", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Optional scheduled logical backups (pg_dump) into ./backups. Start with
  # `docker compose --profile backup up -d`; see docs/backup-restore.md. It
  # reaches the embedded server over the shared unix socket (trust
  # authentication, so POSTGRES_PASSWORD is a placeholder the image insists on).
  backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: ragmux-backup
    restart: unless-stopped
    profiles: ["backup"]
    user: postgres:postgres
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: ragmux
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: unused-socket-trust
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: "8081"
    volumes:
      - ./backups:/backups
      - ragmux-pgsocket:/var/run/postgresql
    depends_on:
      ragmux:
        condition: service_healthy

volumes:
  ragmux-data:
  ragmux-pgsocket:
