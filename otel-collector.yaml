# Minimal OpenTelemetry Collector configuration for Ragmux, used by
# docker-compose.otel.yml. See docs/observability.md.
#
# Ragmux exports OTLP/HTTP with the JSON encoding on /v1/traces, which the
# http receiver below accepts with no extra settings. Only traces are sent:
# metrics go to Prometheus at /metrics and logs to stdout as JSON.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batching is done here rather than in the gateway's exporter, which sends
  # small uncompressed batches on purpose.
  batch:
    timeout: 5s
    send_batch_size: 512
  # A ceiling so a span flood cannot take the Collector down with the
  # gateway it is meant to observe.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  # Prints every span it receives. Replace this with one of the blocks below
  # once the wiring is confirmed.
  debug:
    verbosity: detailed

  # --- Jaeger (all-in-one exposes OTLP on 4317) ---
  # otlp/jaeger:
  #   endpoint: jaeger:4317
  #   tls:
  #     insecure: true

  # --- Grafana Tempo ---
  # otlp/tempo:
  #   endpoint: tempo:4317
  #   tls:
  #     insecure: true

  # --- A vendor's OTLP endpoint ---
  # otlphttp/vendor:
  #   endpoint: https://otlp.example-vendor.com
  #   headers:
  #     authorization: "Bearer ${env:VENDOR_API_KEY}"
  #   compression: gzip

  # --- Langfuse (OTLP/HTTP; cloud or self-hosted) ---
  # Langfuse takes OTLP over HTTP only, at /api/public/otel. The header is
  # Basic auth of "<public key>:<secret key>" base64-encoded; build it
  # outside this file, e.g. LANGFUSE_AUTH=$(printf '%s' "pk-lf-...:sk-lf-..." | base64).
  # Ragmux spans carry gen_ai.* attributes but no prompt or completion text.
  # otlphttp/langfuse:
  #   endpoint: https://cloud.langfuse.com/api/public/otel
  #   headers:
  #     authorization: "Basic ${env:LANGFUSE_AUTH}"

  # --- Arize Phoenix (self-hosted; OTLP/HTTP on 6006, gRPC on 4317) ---
  # otlphttp/phoenix:
  #   endpoint: http://phoenix:6006
  #   tls:
  #     insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
  telemetry:
    logs:
      level: info
