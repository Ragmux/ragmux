name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Default tags (<version>, <major>.<minor>, latest): the all-in-one image
      # with the embedded PostgreSQL (Dockerfile.aio).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/ragmux/ragmux
            ${{ env.DOCKERHUB_USERNAME != '' && 'docker.io/ragmux/ragmux' || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.aio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign image (GHCR)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/ragmux/ragmux@${DIGEST}"
      - name: Sign image (Docker Hub)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "docker.io/ragmux/ragmux@${DIGEST}"
      # "-app" tags (<version>-app, <major>.<minor>-app, latest-app): the
      # gateway alone on a distroless base, for an external database.
      - name: Image metadata (app-only)
        id: meta_app
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/ragmux/ragmux
            ${{ env.DOCKERHUB_USERNAME != '' && 'docker.io/ragmux/ragmux' || '' }}
          flavor: |
            suffix=-app,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push (app-only)
        id: build_app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign image (GHCR, app-only)
        env:
          DIGEST: ${{ steps.build_app.outputs.digest }}
        run: cosign sign --yes "ghcr.io/ragmux/ragmux@${DIGEST}"
      - name: Sign image (Docker Hub, app-only)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DIGEST: ${{ steps.build_app.outputs.digest }}
        run: cosign sign --yes "docker.io/ragmux/ragmux@${DIGEST}"
      # "-paradedb" tags (<version>-paradedb, <major>.<minor>-paradedb,
      # latest-paradedb): the all-in-one image on ParadeDB, whose PostgreSQL
      # carries pg_search (BM25) as well as pgvector. Same gateway, same data
      # layout; upgrading from the default image is a plain image swap.
      - name: Image metadata (paradedb)
        id: meta_paradedb
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/ragmux/ragmux
            ${{ env.DOCKERHUB_USERNAME != '' && 'docker.io/ragmux/ragmux' || '' }}
          flavor: |
            suffix=-paradedb,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push (paradedb)
        id: build_paradedb
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.aio.paradedb
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_paradedb.outputs.tags }}
          labels: ${{ steps.meta_paradedb.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign image (GHCR, paradedb)
        env:
          DIGEST: ${{ steps.build_paradedb.outputs.digest }}
        run: cosign sign --yes "ghcr.io/ragmux/ragmux@${DIGEST}"
      - name: Sign image (Docker Hub, paradedb)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DIGEST: ${{ steps.build_paradedb.outputs.digest }}
        run: cosign sign --yes "docker.io/ragmux/ragmux@${DIGEST}"
      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
